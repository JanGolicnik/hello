<!doctype html>
<html lang="{{ language }}">
    {{{ c.head() }}}
    <body>

        <nav>
            {{{ sections[language].map(s => `<a class="samesite" href="#${s}">${s}</a>`).join("") }}}
            <a class="margin-left" href="/{{ language === "en" ? "./sl/" : "./"}}">{{ language === "en" ? "sl" : "en"}}</a>
        </nav>

        <main>
            <markdown>{{{ sections.en.map(s => c[`${language}/${s}`]()).join("") }}}</markdown>
        </main>

        <footer>
            <p class="muted cute">{{ language === "en" ? "generated with" : "generirano z"}} <a href="#gss">gss</a></p>
        </footer>

        <div id="offscreen"></div>
        {{{ c.plant() }}}

    </body>
</html>

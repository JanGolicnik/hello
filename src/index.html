<!doctype html>
<html lang="{{ language }}">
    <script>
      const t = localStorage.theme;
      if (t) document.documentElement.dataset.theme = t;
    </script>

    {{{ c.head() }}}
    <body>
        <nav>
            <input id="nav-toggle" type="checkbox">
            <div>
                <a href="/{{ language === "en" ? "./sl/" : "./"}}">{{ language === "en" ? "sl" : "en"}}</a>
                <a id="setup-orientation-btn" class="hidden" onclick="try_setup_input()">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M280-280v-80h240q-14-17-22.5-37T484-440H360v-80h124q5-23 13.5-43t22.5-37H120v-80h560q83 0 141.5 58.5T880-480q0 83-58.5 141.5T680-280H280Zm400-80q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35ZM80-440v-80h240v80H80Zm40 160v-80h120v80H120Z"/></svg>
                </a>
                <a id="theme" rel="noopener" onclick="toggleTheme()">
                    <svg class="light-only" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>
                    <svg class="dark-only" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-760v-160h80v160h-80Zm266 110-55-55 112-115 56 57-113 113Zm54 210v-80h160v80H760ZM440-40v-160h80v160h-80ZM254-652 140-763l57-56 113 113-56 54Zm508 512L651-255l54-54 114 110-57 59ZM40-440v-80h160v80H40Zm157 300-56-57 112-112 29 27 29 28-114 114Zm113-170q-70-70-70-170t70-170q70-70 170-70t170 70q70 70 70 170t-70 170q-70 70-170 70t-170-70Zm283-57q47-47 47-113t-47-113q-47-47-113-47t-113 47q-47 47-47 113t47 113q47 47 113 47t113-47ZM480-480Z"/></svg>
                </a>
                <label for="nav-toggle">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
                </label>
            </div>
            <div>
                {{{ sections[language].map((s, i) => `<a class="samesite" href="#h-${sections["en"][i]}">${s}</a>`).join("") }}}
            </div>
        </nav>


        <main>
            <markdown>{{{ sections.en.map(s => c[`${language}/${s}`]()).join("") }}}</markdown>
        </main>

        <footer>
            <p class="muted cute">{{ language === "en" ? "generated with" : "generirano z"}} <a href="#gss">gss</a></p>
        </footer>

        <div id="offscreen"></div>
        {{{ c.plant() }}}

    </body>

    <script defer>
      function toggleTheme() {
        const preference = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const current = document.documentElement.dataset.theme ?? preference;
        localStorage.theme = document.documentElement.dataset.theme = current === 'dark' ? 'light' : 'dark';
      }
    </script>
</html>
